name: Release APK

# Tag filters can't be scoped to a branch, so the job checks that the tagged commit is on master.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NDK_VERSION: 27.0.12077973
  CMAKE_VERSION: 3.22.1
  OPUS_TAG: v1.5.2
  RNNOISE_COMMIT: bad0a75
  # SHA-256 of the release signing cert (docs/BUILD.md); guards against a wrong key in the secret.
  EXPECTED_CERT_SHA256: 6fda439f1d91b4b628397d5784ec0ecc1dbb5f310154d8feababd87613797245

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Require tag on master
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master \
            || { echo "::error::$GITHUB_REF_NAME is not on master"; exit 1; }

      - name: Require tag to match versionName
        run: |
          version=$(sed -nE 's/^\s*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          [ "v$version" = "$GITHUB_REF_NAME" ] \
            || { echo "::error::tag $GITHUB_REF_NAME != versionName $version"; exit 1; }

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install NDK + CMake
        run: sdkmanager "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" "platforms;android-35" "build-tools;35.0.0"

      - name: Fetch vendored native sources
        run: |
          cpp=core-audio/src/main/cpp
          git clone --depth 1 --branch "$OPUS_TAG" https://github.com/xiph/opus.git "$cpp/opus"
          rm -rf "$cpp/opus/.git"
          git clone https://github.com/xiph/rnnoise.git "$RUNNER_TEMP/rnnoise"
          git -C "$RUNNER_TEMP/rnnoise" checkout "$RNNOISE_COMMIT"
          mkdir -p "$cpp/rnnoise/src" "$cpp/rnnoise/include"
          cp "$RUNNER_TEMP/rnnoise/include/rnnoise.h" "$cpp/rnnoise/include/"
          cp "$RUNNER_TEMP"/rnnoise/src/*.c "$RUNNER_TEMP"/rnnoise/src/*.h "$cpp/rnnoise/src/"
          rm -f "$cpp/rnnoise/src/dump_features.c"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::secret $v is not set"; exit 1; }
          done
          umask 077
          ks="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$ks"
          {
            echo "storeFile=$ks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          echo "$certs" | grep -qi "SHA-256 digest: $EXPECTED_CERT_SHA256" \
            || { echo "::error::APK not signed with the expected release key"; exit 1; }

      - name: Rename APK
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/grumbla-$GITHUB_REF_NAME.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grumbla-${{ github.ref_name }}
          path: dist/

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties
